apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-web
spec:
  rules:
  - host: {{ .Values.app.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Chart.Name }}-app
            port:
              number: {{ .Values.app.servicePort }}
