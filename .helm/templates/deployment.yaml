{{ $name := .Chart.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-web
  labels:
    app: {{ $name }}-web
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}-web
  template:
    metadata:
      labels:
        app: {{ $name }}-web
    spec:
      imagePullSecrets:
      - name: registrysecret
      containers:
      - name: app
        image: {{ .Values.werf.image.app }}
        command: ["/goapp"]
        ports:
        - containerPort: {{ .Values.app.containerPort }}
